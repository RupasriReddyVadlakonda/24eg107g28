# Load local environment variables from the project root .env file
spring.config.import=optional:file:../.env[.properties]

# Database configuration is supplied through the environment in production.
# The local defaults are used only when no environment values are present.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/personal_data_vault?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:vault_app}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:${JPA_DDL_AUTO:update}}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Data Encryption
app.encryption.key=${ENCRYPTION_KEY}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Rate Limiting
app.rate-limit.max-requests=${RATE_LIMIT_MAX:10}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:300}

# Security Alerts
app.security-alert.unauthorized-threshold=${ALERT_UNAUTHORIZED_THRESHOLD:10}
app.security-alert.window-seconds=${ALERT_WINDOW_SECONDS:300}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.datavault.personal_data_vault=INFO
logging.level.org.springframework.security=WARN