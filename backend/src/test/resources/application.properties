
# Application
spring.application.name=personal-data-vault
server.port=${PORT:8080}

# MySQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# Data Encryption
app.encryption.key=${ENCRYPTION_KEY}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate Limiting
app.rate-limit.max-requests=10
app.rate-limit.window-seconds=300

# Security Alerts
app.security-alert.unauthorized-threshold=10
app.security-alert.window-seconds=300